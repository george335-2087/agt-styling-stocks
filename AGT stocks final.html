  $('vehicle').classList.toggle('hidden',u);
  opts($('model'),D[m]||[],'Select model');
  $('compat').innerHTML=(D[m]||[]).map(x=>`<label><input type="checkbox" value="${x}">${x}</label>`).join('');
  updateCompatLabel();
}
function toggleCompat(){ $('compat').classList.toggle('open'); }
function updateCompatLabel(){
  let a=[...$('compat').querySelectorAll('input:checked')].map(c=>c.value);
  $('compatBox').textContent=a.length?a.join(', '):'Select compatible models';
}
document.addEventListener('click',e=>{
  let w=document.querySelector('.compatWrap');
  if(w && !w.contains(e.target)) $('compat').classList.remove('open');
});
function openForm(x){
  edit=x?.id||null;
  currentPhotos=[...(x?.photos||[])];
  $('title').textContent=x?'Edit accessory':'Add accessory';
  $('name').value=x?.name||'';
  $('make').value=x?.make||'BMW';
  makeChanged();
  if(x&&x.make!=='Universal')$('model').value=x.model||'';
  $('productType').value=x?.productType||'';
  $('material').value=x?.material||'';
  $('stock').value=x?.stock??1;
  $('priceOut').value=x?.priceOut??'';
  $('websiteLink').value=x?.websiteLink||'';
  $('photosInput').value='';
  renderPhotos();
  [...$('compat').querySelectorAll('input')].forEach(c=>c.checked=(x?.compatible||[]).includes(c.value));
  updateCompatLabel();
  $('dlg').showModal();
}
function addPhotos(input){
  const files=[...input.files];
  if(!files.length)return;
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1200, scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        currentPhotos.push(c.toDataURL('image/jpeg',0.78)); renderPhotos();
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
  input.value='';
}
function renderPhotos(){
  $('photoGrid').innerHTML=currentPhotos.length?currentPhotos.map((src,i)=>`<div class="photoItem"><img src="${src}" alt="Product photo ${i+1}"><button type="button" onclick="removePhoto(${i})">×</button></div>`).join(''):'<div style="color:#777;font-size:13px;grid-column:1/-1">No photos added</div>';
}
function removePhoto(i){currentPhotos.splice(i,1);renderPhotos();}
function nextProductId(){
  // Product IDs are sequential numbers. Ignore legacy timestamp-style IDs
  // created by older app versions (e.g. 13-digit Date.now() values).
  const nums=items.map(x=>Number(String(x.id)))
    .filter(n=>Number.isSafeInteger(n)&&n>=1&&n<=1000000);
  return String((nums.length?Math.max(...nums):0)+1);
}
async function saveItem(){
  let name=$('name').value.trim();
  if(!name)return alert('Enter accessory name');
  let m=$('make').value,u=m==='Universal';
  if(!u && !$('model').value)return alert('Select model');
  let x={
    id:edit||nextProductId(),name,make:m,model:u?'Universal':$('model').value,
    compatible:u?[]:[...$('compat').querySelectorAll('input:checked')].map(c=>c.value),
    material:$('material').value,productType:$('productType').value,stock:Math.max(0,Number($('stock').value)||0),
    priceOut:Math.max(0,Number($('priceOut').value)||0),websiteLink:$('websiteLink').value.trim(),photos:[...currentPhotos]
  };
  if(edit){let old=items.find(i=>String(i.id)===String(edit));x.priceIn=old?.priceIn??0;x.sourceMaterial=old?.sourceMaterial||'';}
  try{
    const r=await fetch(SUPABASE_REST,{method:'POST',headers:sbHeaders({'Prefer':'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(toDb(x))});
    if(!r.ok) throw new Error(await r.text());
    const saved=fromDb((await r.json())[0]||toDb(x));
    items=edit?items.map(i=>String(i.id)===String(edit)?saved:i):[saved,...items];
    localStorage.agtStocks=JSON.stringify(items);
    $('dlg').close();render();
  }catch(err){alert('Save failed.\n'+err.message);}
}
function render(){
  let q=$('search').value.toLowerCase().trim(),fm=$('fmake').value,fmo=$('fmodel').value,ft=$('fmat').value,fs=$('fstock').value,ftype=$('ftype').value;
  const hasFilter=!!(q||fm||fmo||ft||fs||ftype);
  if(!hasFilter){$('list').innerHTML='<div class="emptyStart">Search for a product or select a filter to view stock.</div>';return;}
  let a=items.filter(x=>
    (!q||JSON.stringify(x).toLowerCase().includes(q))&&
    (!fm||x.make===fm)&&(!fmo||x.model===fmo||(x.compatible||[]).includes(fmo))&&
    (!ft||x.material===ft)&&(!fs||(fs==='in'?x.stock>0:x.stock===0))&&(!ftype||x.productType===ftype)
  );
  $('list').innerHTML=a.length?a.map(x=>`<div class="card"><div class="row"><strong>${e(x.name)}</strong><span class="pill">Stock: ${x.stock??0}</span></div>
  <div style="color:#bbb;margin-top:7px">${e(x.make)}${x.model&&x.model!=='Universal'?' · '+e(x.model):''}${x.productType?' · '+e(x.productType):''}${x.compatible?.length?' · Compatible: '+e(x.compatible.join(', ')):''}${x.material?' · '+e(x.material):''}${!x.material&&x.sourceMaterial?' · '+e(x.sourceMaterial):''}</div>
  ${x.websiteLink?`<a class="websiteLink" href="${e(x.websiteLink)}" target="_blank" rel="noopener">🔗 View product</a>`:''}
  ${x.photos?.length?`<div class="thumbs">${x.photos.map((p,i)=>`<img src="${p}" onclick='viewPhotos(${JSON.stringify(x.photos)},${i})' alt="Product photo ${i+1}">`).join('')}</div>`:''}
  <div class="priceRow">${x.priceOut!==undefined&&x.priceOut!==null&&x.priceOut!==''?`<span class="price">€${Number(x.priceOut).toFixed(2)}</span>`:''}</div>
  <div class="actions"><button class="secondary" onclick='openForm(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick='del(${JSON.stringify(x.id)})'>Delete</button></div></div>`).join(''):'<div style="color:#888;text-align:center;padding:30px">Not available</div>';
}
let lightboxPhotos=[],lightboxIndex=0;
function viewPhotos(photos,index=0){lightboxPhotos=photos||[];lightboxIndex=index;showLightboxPhoto();$('lightbox').classList.add('open');}
function showLightboxPhoto(){if(!lightboxPhotos.length)return;$('lightboxImg').src=lightboxPhotos[lightboxIndex];$('lightboxCount').textContent=(lightboxIndex+1)+' / '+lightboxPhotos.length;}
function closeLightbox(ev){if(ev&&ev.target!==$('lightbox')&&ev.target.className!=='lightboxClose')return;$('lightbox').classList.remove('open');}
function nextPhoto(dir){if(!lightboxPhotos.length)return;lightboxIndex=(lightboxIndex+dir+lightboxPhotos.length)%lightboxPhotos.length;showLightboxPhoto();}
document.addEventListener('keydown',ev=>{if(!$('lightbox').classList.contains('open'))return;if(ev.key==='Escape')closeLightbox();if(ev.key==='ArrowRight')nextPhoto(1);if(ev.key==='ArrowLeft')nextPhoto(-1);});
async function del(id){
  if(!confirm('Delete this accessory?'))return;
  try{
    const r=await fetch(SUPABASE_REST+'?id=eq.'+encodeURIComponent(String(id)),{method:'DELETE',headers:sbHeaders({'Prefer':'return=minimal'})});
    if(!r.ok)throw new Error(await r.text());
    items=items.filter(x=>String(x.id)!==String(id));
    localStorage.agtStocks=JSON.stringify(items);render();
  }catch(err){alert('Delete failed.\n'+err.message);}
}
